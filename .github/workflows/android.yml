name: Compiler Onde Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          SDKM=$(find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager trouve : $SDKM"
          if [ -z "$SDKM" ]; then
            echo "ERREUR : sdkmanager introuvable"
            exit 1
          fi
          yes | "$SDKM" --licenses || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Executer les tests unitaires
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Compiler APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Conserver APK
        uses: actions/upload-artifact@v4
        with:
          name: Onde-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Controler le code Android (lint)
        run: gradle --no-daemon --stacktrace :app:lintDebug

      - name: Conserver les rapports de validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Onde-rapports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
